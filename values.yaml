# values.yaml for landing-frontend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/admin-frontend
  tag: "production-bbd9355"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: dev-admin.fitnest.az
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - dev-admin.fitnest.az
      secretName: fitnest-tls
  backend:
    service:
      name: ""
      port: 80
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 384Mi
env:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: "https://dev-api.fitnest.az"
  API_BASE_URL: "http://gateway-backend:80"
assetLinks:
  enabled: true
  secretName: assetlinks-secret
