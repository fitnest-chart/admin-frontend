# values.yaml for landing-frontend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/admin-frontend
  tag: "production-6473178"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: admin.fitnest.az
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - admin.fitnest.az
      secretName: fitnest-tls
  backend:
    service:
      name: ""
      port: 80
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 384Mi
env:
  NEXT_PUBLIC_ADMIN_ENV: "production"
  NEXT_PUBLIC_SIBLING_ADMIN_URL: "https://admin-dev.fitnest.az"
  SIBLING_API_BASE_URL: "http://gateway-backend.fitnest-development.svc.cluster.local"
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: "https://api.fitnest.az"
  API_BASE_URL: "http://gateway-backend:80"
# Loaded from K8s secret admin-sibling-env (and/or Vault) — do not put empty value in chart.
siblingEnvSecret: admin-sibling-env
assetLinks:
  enabled: true
  secretName: assetlinks-secret
